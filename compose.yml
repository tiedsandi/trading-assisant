name: ${COMPOSE_PROJECT_NAME:-trading-assistant}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-trading_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_assistant_dev}
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      # Constraint errors must not log complete auth rows or bind parameters.
      - -c
      - log_error_verbosity=terse
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: &backend-build
      context: ./docker/backend
      args:
        GO_VERSION: ${GO_VERSION:-1.27.1}
        AIR_VERSION: ${AIR_VERSION:-v1.67.3}
    init: true
    working_dir: /app
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-trading_assistant}:${POSTGRES_PASSWORD:-trading_assistant_dev}@postgres:5432/${POSTGRES_DB:-trading_assistant}?sslmode=disable
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:3000}
      TZ: UTC
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - backend_tmp:/app/.tmp
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stdin_open: true
    tty: true

  migrate:
    build: *backend-build
    init: true
    working_dir: /app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-trading_assistant}:${POSTGRES_PASSWORD:-trading_assistant_dev}@postgres:5432/${POSTGRES_DB:-trading_assistant}?sslmode=disable
    volumes:
      - ./backend:/app:ro
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    command: ["go", "run", "-mod=readonly", "./cmd/migrate", "up"]
    restart: "no"

  frontend:
    build:
      context: ./docker/frontend
      args:
        BUN_VERSION: ${BUN_VERSION:-1.4.2}
    init: true
    working_dir: /app
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
      TZ: UTC
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
      - bun_install_cache:/root/.bun/install/cache
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  go_modules:
  go_build_cache:
  backend_tmp:
  frontend_node_modules:
  frontend_next_cache:
  bun_install_cache:
